name: cashback

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: cashback
      POSTGRES_PASSWORD: cashback
      POSTGRES_DB: cashback
    # Exposed so `go run ./cmd/seed` and local `go run .` can reach it.
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashback -d cashback"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:8-alpine
    # Exposed so local `go run .` and tests can reach it.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://cashback:cashback@db:5432/cashback?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # debug, info, warn or error. Logs are JSON on stdout, with secrets redacted.
      LOG_LEVEL: info
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
